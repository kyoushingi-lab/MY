name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static site
        run: |
          npm install --no-audit --no-fund
          mkdir -p dist/assets
          cp index.html dist/
          cp -R images dist/
          cp assets/site.js dist/assets/
          npm run build
          sed -i "s|assets/site.css|assets/site.css?v=${GITHUB_SHA}|; s|assets/site.js|assets/site.js?v=${GITHUB_SHA}|" dist/index.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
